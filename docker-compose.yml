services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: finance
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]   # ← persistence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:                                           # named volume survives recreate
